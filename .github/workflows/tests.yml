name: Framework checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: node tests/test_dashboard.mjs
      - run: python -m build
      # Unit/API tests use a declared synthetic oracle. Model/data-dependent
      # equivalence experiments are documented separately in docs/verification.md.
  optional-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,onnx,torch]" onnx
      - run: python -m pytest tests/test_torchscript.py tests/test_onnx.py
